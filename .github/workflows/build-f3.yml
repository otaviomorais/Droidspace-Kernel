name: Build POCO F3 kernel (aosp-16 + ntsync + KernelSU-Next + MGLRU + DroidSpaces)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Branch de PocoF3Releases/kernel_xiaomi_sm8250'
        required: false
        default: 'aosp-16'
      device:
        description: 'Dispositivo (defconfig base)'
        required: false
        default: 'alioth'

permissions:
  contents: write

concurrency:
  group: kernel-build-pf3
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'aosp-16' }}
      DEVICE: ${{ github.event.inputs.device || 'alioth' }}
      KSU_COMMIT: '53791c92bff13d62338f29cc9da035a37652ca91'
    steps:
      - name: Checkout patches (Droidspace-Kernel)
        uses: actions/checkout@v4
        with:
          path: droidspace

      - name: Install dependencies + python2 shim (dtbo.img usa python2)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            flex bison bc zip unzip file python3 \
            libssl-dev libncurses-dev kmod
          sudo ln -sf /usr/bin/python3 /usr/local/bin/python2

      - name: Clone PocoF3Releases source (aosp-16)
        run: |
          git clone --depth 1 --branch "$KERNEL_BRANCH" \
            https://github.com/PocoF3Releases/kernel_xiaomi_sm8250.git kernel

      - name: Setup KernelSU-Next (full history + symlink)
        run: |
          cd kernel
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          git -C KernelSU-Next checkout "$KSU_COMMIT"
          ln -s ../KernelSU-Next/kernel drivers/kernelsu
          ls -l drivers/kernelsu

      - name: Apply kernel patches (patches/*/*.patch, sorted)
        run: |
          cd kernel
          shopt -s nullglob
          for patch in "$GITHUB_WORKSPACE"/droidspace/patches/*/*.patch; do
            echo "==> Applying $patch"
            git apply --verbose "$patch"
          done

      - name: Install DroidSpaces config fragment
        run: |
          cp "$GITHUB_WORKSPACE/droidspace/configs/droidspaces.config" \
            kernel/arch/arm64/configs/vendor/droidspace.config

      - name: Download Clang 20 (ZyCromerZ)
        run: |
          mkdir -p toolchain
          cd toolchain
          curl -L -o clang.tar.gz \
            https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20250129-release/Clang-20.0.0git-20250129.tar.gz
          tar -xf clang.tar.gz
          CLANG_BIN="$(pwd)/bin"
          if [ ! -x "$CLANG_BIN/clang" ]; then
            CLANG_BIN="$(cd "$(find . -name clang -path '*/bin/*' -exec dirname {} \; | head -1)" && pwd)"
          fi
          echo "Clang em: $CLANG_BIN"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

      - name: Configure kernel (alioth_defconfig + fragments)
        run: |
          cd kernel
          export ARCH=arm64
          export KBUILD_BUILD_USER=Droidspace
          export KBUILD_BUILD_HOST=github-actions
          make O=out LLVM=1 LLVM_IAS=1 HOSTCC=gcc PYTHON=python3 \
            alioth_defconfig
          make O=out LLVM=1 LLVM_IAS=1 HOSTCC=gcc PYTHON=python3 \
            vendor/xiaomi/sm8250-common.config vendor/xiaomi/alioth.config \
            vendor/droidspace.config

      - name: Build kernel
        run: |
          cd kernel
          export ARCH=arm64
          export KBUILD_BUILD_USER=Droidspace
          export KBUILD_BUILD_HOST=github-actions
          make -j"$(nproc)" O=out LLVM=1 LLVM_IAS=1 HOSTCC=gcc PYTHON=python3 \
            CC=clang LD=ld.lld AS=llvm-as AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

      - name: Collect kernel artifacts
        run: |
          cd kernel
          ls -la out/arch/arm64/boot/
          mkdir -p out/pack
          cp out/arch/arm64/boot/Image out/pack/Image
          find out/arch/arm64/boot/dts -name '*.dtb' -exec cat {} + > out/pack/dtb
          cp out/arch/arm64/boot/dtbo.img out/pack/dtbo.img
          ls -la out/pack/

      - name: Package AnyKernel (MagicTime template)
        run: |
          git clone --depth 1 https://github.com/TIMISONG-dev/MagicTime-alioth.git mt
          cp kernel/out/pack/Image mt/Image
          cp kernel/out/pack/dtb mt/dtb
          cp kernel/out/pack/dtbo.img mt/dtbo.img
          cd mt
          rm -rf .git
          ZIP="MagicTime-${DEVICE}-Droidspace-pf3-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "$ZIP" . -x '*.git*'
          mv "$ZIP" "$GITHUB_WORKSPACE/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagicTime-${{ env.DEVICE }}-Droidspace-pf3
          path: MagicTime-*.zip
          if-no-files-found: error

      - name: Create Release
        working-directory: droidspace
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ZIP="$(ls "$GITHUB_WORKSPACE"/MagicTime-*.zip)"
          RELEASE="kernel-pf3-$(date +%Y%m%d-%H%M)"
          gh release create "$RELEASE" "$ZIP" \
            --title "MagicTime ${DEVICE} Droidspace (pf3 aosp-16) $(date +%Y%m%d-%H%M)" \
            --notes "Build do kernel a partir da fonte PocoF3Releases (branch aosp-16) para $DEVICE com:
          - Multi-Gen LRU (MGLRU) backport
          - driver ntsync (Wine/Proton)
          - io_uring (v5.1 backport)
          - KernelSU-Next
          - configs DroidSpaces completas

          Flash via TWRP/recovery."
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/$RELEASE"
