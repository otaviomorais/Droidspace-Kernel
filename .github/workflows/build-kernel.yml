name: Build MagicTime kernel (ntsync + KernelSU + DroidSpaces)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Branch de TIMISONG-dev/kernel_xiaomi_sm8250'
        required: false
        default: 'magictime-tiny'
      device:
        description: 'Dispositivo (defconfig base)'
        required: false
        default: 'alioth'
      create_release:
        description: 'Criar GitHub Release com o zip flashável'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main

concurrency:
  group: kernel-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'magictime-tiny' }}
      DEVICE: ${{ github.event.inputs.device || 'alioth' }}
    steps:
      - name: Checkout patches (Droidspace-Kernel)
        uses: actions/checkout@v4
        with:
          path: droidspace

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            flex bison bc zip unzip file python3 \
            libssl-dev libncurses-dev kmod

      - name: Clone kernel source + KernelSU-Next submodule
        run: |
          git clone --depth 1 --branch "$KERNEL_BRANCH" \
            https://github.com/TIMISONG-dev/kernel_xiaomi_sm8250.git kernel
          cd kernel
          git submodule update --init --depth 1

      - name: Apply ntsync patch
        run: |
          cd kernel
          git apply --verbose \
            "$GITHUB_WORKSPACE/droidspace/patches/ntsync/0001-drivers-misc-Add-NT-synchronization-primitive-emulati.patch"

      - name: Install DroidSpaces config fragment
        run: |
          cp "$GITHUB_WORKSPACE/droidspace/configs/droidspaces.config" \
            kernel/arch/arm64/configs/vendor/droidspace.config

      - name: Download Clang 20 (ZyCromerZ)
        run: |
          mkdir -p toolchain
          cd toolchain
          curl -L -o clang.tar.gz \
            https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20250129-release/Clang-20.0.0git-20250129.tar.gz
          tar -xf clang.tar.gz
          CLANG_BIN="$(pwd)/bin"
          if [ ! -x "$CLANG_BIN/clang" ]; then
            CLANG_BIN="$(cd "$(find . -name clang -path '*/bin/*' -exec dirname {} \; | head -1)" && pwd)"
          fi
          echo "Clang em: $CLANG_BIN"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"

      - name: Configure kernel (defconfig + fragments)
        run: |
          cd kernel
          export ARCH=arm64
          export KBUILD_BUILD_USER=Droidspace
          export KBUILD_BUILD_HOST=github-actions
          make O=out LLVM=1 LLVM_IAS=1 HOSTCC=gcc PYTHON=python3 \
            "${DEVICE}_defconfig"
          make O=out LLVM=1 LLVM_IAS=1 HOSTCC=gcc PYTHON=python3 \
            vendor/xiaomi/magictime-common.config vendor/droidspace.config

      - name: Build kernel
        run: |
          cd kernel
          export ARCH=arm64
          export KBUILD_BUILD_USER=Droidspace
          export KBUILD_BUILD_HOST=github-actions
          make -j"$(nproc)" O=out LLVM=1 LLVM_IAS=1 HOSTCC=gcc PYTHON=python3 \
            CC=clang LD=ld.lld AS=llvm-as AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

      - name: Collect kernel artifacts
        run: |
          cd kernel
          ls -la out/arch/arm64/boot/
          mkdir -p out/pack
          cp out/arch/arm64/boot/Image out/pack/Image
          find out/arch/arm64/boot/dts -name '*.dtb' -exec cat {} + > out/pack/dtb
          cp out/arch/arm64/boot/dtbo.img out/pack/dtbo.img

      - name: Package AnyKernel (MagicTime template)
        run: |
          git clone --depth 1 https://github.com/TIMISONG-dev/MagicTime-alioth.git mt
          cp kernel/out/pack/Image mt/Image
          cp kernel/out/pack/dtb mt/dtb
          cp kernel/out/pack/dtbo.img mt/dtbo.img
          cd mt
          rm -rf .git
          ZIP="MagicTime-${DEVICE}-Droidspace-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "$ZIP" . -x '*.git*'
          mv "$ZIP" "$GITHUB_WORKSPACE/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagicTime-${{ env.DEVICE }}-Droidspace
          path: MagicTime-*.zip
          if-no-files-found: error

      - name: Create Release
        if: inputs.create_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "kernel-$(date +%Y%m%d-%H%M)" MagicTime-*.zip \
            --generate-notes
