name: Build Droidspace Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Kernel version'
        required: false
        default: '1.1.0'
      description:
        description: 'Release description'
        required: false
        default: 'Droidspace Kernel for Poco F3 (alioth) with DroidSpaces + ntsync support'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison flex openssl libelf-dev \
            python3 python3-pip python3-venv \
            gcc g++ make automake autoconf \
            curl git zip unzip \
            libncurses-dev libssl-dev \
            p7zip-full ccache \
            lz4 xz-utils zlib1g-dev

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-kernel-ccache
          max-size: 10G

      - name: Download Clang toolchain
        run: |
          mkdir -p toolchains/clang
          wget -q -O /tmp/clang.tar.gz \
            "https://github.com/ZyCromerZ/Clang/releases/download/20.0.0git-20250129-release/Clang-20.0.0git-20250129.tar.gz"
          tar -zxf /tmp/clang.tar.gz -C toolchains/clang
          rm -f /tmp/clang.tar.gz
          echo "=== Structure ==="
          ls toolchains/clang/
          echo "=== bin/ exists? ==="
          ls toolchains/clang/bin/ 2>/dev/null | head -5 || echo "No bin/ directory"
          echo "=== ld.lld locations ==="
          find toolchains/clang -name 'ld.lld' 2>/dev/null
          find toolchains/clang -name 'lld' -type f 2>/dev/null
          echo "=== Clang version ==="
          find toolchains/clang -name 'clang' -type f -executable | head -1 | xargs {} --version 2>/dev/null | head -1 || true

      - name: Fix toolchain paths
        run: |
          CLANG_DIR="${{ github.workspace }}/toolchains/clang"

          if [ -d "${CLANG_DIR}/bin" ]; then
            echo "tarball has bin/ dir, using as-is"
            CLANG_BIN="${CLANG_DIR}/bin"
          else
            echo "tarball has no bin/ dir, creating one with symlinks"
            mkdir -p "${CLANG_DIR}/bin"
            for f in "${CLANG_DIR}"/*; do
              if [ -f "$f" ] && [ -x "$f" ]; then
                ln -sf "$f" "${CLANG_DIR}/bin/$(basename "$f")"
              fi
            done
            CLANG_BIN="${CLANG_DIR}/bin"
          fi

          echo "=== Clang bin contents ==="
          ls "${CLANG_BIN}/" | grep -E 'clang|ld\.lld|lld|ar|nm|objcopy|objdump|strip|as|readelf' || true
          echo "=== Verify ld.lld ==="
          "${CLANG_BIN}/ld.lld" --version 2>&1 | head -1 || echo "ld.lld not executable"
          echo "=== Verify clang ==="
          "${CLANG_BIN}/clang" --version 2>&1 | head -1 || echo "clang not found"

      - name: Download GCC toolchains
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            toolchains/arm-linux-androideabi-4.9
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            toolchains/aarch64-linux-android-4.9

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b magictime-new \
            https://github.com/TIMISONG-dev/kernel_xiaomi_sm8250.git \
            kernel_source
          cd kernel_source
          # Remove old KernelSU-Next (rsuntk) if present
          rm -rf KernelSU-Next 2>/dev/null || true
          git config --unset-all submodule.KernelSU-Next.url 2>/dev/null || true
          # Clone ReSukiSU (main)
          echo "=== Cloning ReSukiSU (main) ==="
          git clone --depth=1 \
            https://github.com/ReSukiSU/ReSukiSU.git \
            KernelSU
          # Verify ReSukiSU was checked out
          if [ ! -f KernelSU/kernel/Kbuild ] && [ ! -f KernelSU/kernel/Makefile ]; then
            echo "ERROR: ReSukiSU failed to checkout!"
            exit 1
          fi
          # Ensure symlink exists
          if [ ! -L drivers/kernelsu ]; then
            ln -sf ../KernelSU/kernel drivers/kernelsu
          fi
          # Ensure Makefile entry exists
          grep -q "kernelsu" drivers/Makefile || \
            printf "\nobj-$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          # Ensure Kconfig entry exists BEFORE defconfig so CONFIG_KSU is visible
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || \
            sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig
          # ReSukiSU does not need cpus_allowed patch (compat layer handles it)
          echo "=== ReSukiSU ready ==="

      - name: Setup SUSFS anti-detection
        run: |
          echo "=== Cloning susfs4ksu kernel-4.19 patches ==="
          git clone --depth=1 -b kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu.git toolchains/susfs4ksu 2>/dev/null || \
            git clone --depth=1 https://github.com/sidex15/susfs4ksu.git toolchains/susfs4ksu 2>/dev/null || true
          if [ -d "${{ github.workspace }}/toolchains/susfs4ksu/kernel_patches" ]; then
            echo "=== Copying SUSFS files into kernel source ==="
            cp -r ${{ github.workspace }}/toolchains/susfs4ksu/kernel_patches/include/linux/susfs*.h kernel_source/include/linux/ 2>/dev/null || true
            cp ${{ github.workspace }}/toolchains/susfs4ksu/kernel_patches/fs/susfs.c kernel_source/fs/ 2>/dev/null || true
            cd kernel_source
            echo "=== Patching Linux 4.19 VFS for SUSFS ==="
            patch -p1 < ${{ github.workspace }}/toolchains/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch 2>/dev/null || true
            # IMPORTANT: Do NOT apply 10_enable_susfs_for_ksu.patch!
            # ReSukiSU already has SUSFS integration built into its driver code.
            # Applying it would CONFLICT with ReSukiSU's own Kconfig/Kbuild.
            echo "=== SUSFS VFS patched successfully (ReSukiSU driver handles the rest) ==="
          fi

      - name: Apply ReSukiSU manual hooks
        run: |
          echo "=== Applying ReSukiSU manual hooks to kernel source ==="
          cd kernel_source
          if [ -f ${{ github.workspace }}/patches/resukisu-hooks/apply_hooks.sh ]; then
            bash ${{ github.workspace }}/patches/resukisu-hooks/apply_hooks.sh .
            echo "=== ReSukiSU manual hooks applied ==="
          else
            echo "=== WARNING: ReSukiSU hook patcher not found! Build may fail. ==="
          fi

      - name: Setup ntsync
        run: |
          cd kernel_source
          # Copy ntsync driver source
          cp ${{ github.workspace }}/patches/ntsync/ntsync.c drivers/misc/
          echo "  -> drivers/misc/ntsync.c copied"
          # Copy UAPI header
          cp ${{ github.workspace }}/patches/ntsync/ntsync.h include/uapi/linux/
          echo "  -> include/uapi/linux/ntsync.h copied"
          # Add entry to drivers/misc/Makefile
          grep -q "CONFIG_NTSYNC" drivers/misc/Makefile || \
            printf "obj-$(CONFIG_NTSYNC)\t\t+= ntsync.o\n" >> drivers/misc/Makefile
          echo "  -> drivers/misc/Makefile patched"
          # Add Kconfig entry
          grep -q "config NTSYNC" drivers/misc/Kconfig || \
            sed -i "/endmenu/i\config NTSYNC\n\ttristate \"NT synchronization primitive emulation\"\n\tdefault y\n\thelp\n\t  This module provides kernel support for emulation of Windows NT\n\t  synchronization primitives for Wine/Proton.\n\t  If unsure, say N.\n" drivers/misc/Kconfig
          echo "  -> drivers/misc/Kconfig patched"
          echo "=== ntsync ready ==="

      - name: Clone AnyKernel
        run: |
          git clone --depth=1 \
            https://github.com/TIMISONG-dev/MagicTime-alioth.git \
            AnyKernel
          echo "=== Patching AnyKernel for 6GB ZRAM & Overlay ==="
          mkdir -p AnyKernel/ramdisk/overlay.d
          printf 'on property:sys.boot_completed=1\n    exec - root root -- /system/bin/sh -c "if [ $(cat /sys/block/zram0/disksize 2>/dev/null || echo 0) -lt 6442450944 ]; then swapoff /dev/block/zram0 2>/dev/null; echo 1 > /sys/block/zram0/reset 2>/dev/null; echo 6442450944 > /sys/block/zram0/disksize 2>/dev/null; mkswap /dev/block/zram0 2>/dev/null; swapon /dev/block/zram0 -p 32767 2>/dev/null; fi"\n' > AnyKernel/ramdisk/overlay.d/init.zram.rc
          if [ -f AnyKernel/anykernel.sh ]; then
            grep -q "Patching ZRAM size to 6GB" AnyKernel/anykernel.sh || \
              printf '\n# Patch fstab for 6GB ZRAM\nui_print "Patching ZRAM size to 6GB (6442450944 bytes)...";\nfor fstab in $ramdisk/fstab* $ramdisk/etc/fstab* $ramdisk/vendor/etc/fstab* /vendor/etc/fstab* /system/etc/fstab*; do\n  if [ -f "$fstab" ] && grep -q "zram" "$fstab"; then\n    sed -i -E "s/zramsize=[0-9%%]+/zramsize=6442450944/g" "$fstab" 2>/dev/null || true;\n  fi;\ndone;\n' >> AnyKernel/anykernel.sh
          fi

      - name: Install kernel config
        run: |
          mkdir -p kernel_source/arch/arm64/configs/vendor/xiaomi
          cp configs/droidspaces.config \
            kernel_source/arch/arm64/configs/vendor/xiaomi/droidspaces.config

      - name: Configure kernel
        run: |
          CLANG_DIR="${{ github.workspace }}/toolchains/clang"
          if [ -d "${CLANG_DIR}/bin" ] && [ -f "${CLANG_DIR}/bin/clang" ]; then
            CLANG_BIN="${CLANG_DIR}/bin"
          else
            CLANG_BIN="${CLANG_DIR}"
          fi
          export PATH="${CLANG_BIN}:${{ github.workspace }}/toolchains/aarch64-linux-android-4.9/bin:${{ github.workspace }}/toolchains/arm-linux-androideabi-4.9/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          cd kernel_source
          # Generate base config
          make O=out alioth_defconfig
          # Merge config fragments
          scripts/kconfig/merge_config.sh -O out \
            out/.config \
            arch/arm64/configs/vendor/xiaomi/magictime-common.config \
            arch/arm64/configs/vendor/xiaomi/droidspaces.config
          make O=out olddefconfig
          # Verify KSU is enabled
          grep -q "CONFIG_KSU=y" out/.config && echo "KSU enabled: YES" || echo "WARNING: KSU not enabled!"
          # Verify ReSukiSU manual hook (required for Linux 4.19)
          grep -q "CONFIG_KSU_MANUAL_HOOK=y" out/.config && echo "KSU Manual Hook: YES" || echo "WARNING: KSU Manual Hook not enabled!"
          # Verify ntsync is enabled
          grep -q "CONFIG_NTSYNC=y" out/.config && echo "ntsync enabled: YES" || echo "WARNING: ntsync not enabled!"
          # Verify SUSFS is enabled (ReSukiSU)
          grep -q "CONFIG_KSU_SUSFS=y" out/.config && echo "SUSFS enabled: YES" || echo "WARNING: SUSFS not enabled!"

      - name: Build kernel
        run: |
          CLANG_DIR="${{ github.workspace }}/toolchains/clang"
          if [ -d "${CLANG_DIR}/bin" ] && [ -f "${CLANG_DIR}/bin/clang" ]; then
            CLANG_BIN="${CLANG_DIR}/bin"
          else
            CLANG_BIN="${CLANG_DIR}"
          fi
          export PATH="${CLANG_BIN}:${{ github.workspace }}/toolchains/aarch64-linux-android-4.9/bin:${{ github.workspace }}/toolchains/arm-linux-androideabi-4.9/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC="ccache clang"
          export HOSTCC=gcc
          export LD=ld.lld
          export AS=llvm-as
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export LLVM=1
          export LLVM_IAS=1
          export KBUILD_BUILD_USER=Droidspace
          export KBUILD_BUILD_HOST=github-actions
          echo "=== Verify tools ==="
          which ld.lld
          which clang
          which llvm-ar
          cd kernel_source
          make -j$(nproc) \
            O=out \
            CC="ccache clang" \
            HOSTCC=gcc \
            LD=ld.lld \
            AS=llvm-as \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1

          echo "=== Build dtbo.img ==="
          make -j$(nproc) \
            O=out \
            CC="ccache clang" \
            HOSTCC=gcc \
            LD=ld.lld \
            AS=llvm-as \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 \
            dtbo.img 2>&1 || echo "dtbo.img target not available, skipping"

      - name: Package kernel
        id: package
        run: |
          OUT=kernel_source/out

          cp "$OUT/arch/arm64/boot/Image" AnyKernel/Image

          DTB_OUT=$(find "$OUT/arch/arm64/boot/dts" -name '*.dtb' 2>/dev/null)
          if [ -n "$DTB_OUT" ]; then
            find "$OUT/arch/arm64/boot/dts" -name '*.dtb' -exec cat {} + > AnyKernel/dtb
            echo "DTBs concatenated: $(wc -c < AnyKernel/dtb) bytes"
          else
            echo "Warning: No DTB files found in $OUT/arch/arm64/boot/dts"
          fi

          DTBO_PATH=$(find "$OUT/arch/arm64/boot" -name 'dtbo.img' | head -1)
          if [ -n "$DTBO_PATH" ]; then
            cp "$DTBO_PATH" AnyKernel/dtbo.img
            echo "dtbo.img found and copied: $(wc -c < AnyKernel/dtbo.img) bytes"
          else
            echo "dtbo.img not found - will not be included in zip"
          fi

          cd AnyKernel
          rm -f *.zip
          BUILD_DATE=$(date '+%Y-%m-%d_%H-%M-%S')
          ZIP_NAME="Droidspace-alioth-v${{ inputs.version || '1.0.0' }}-${BUILD_DATE}.zip"
          7z a -mx9 "$ZIP_NAME" * -x!*.zip
          cp "$ZIP_NAME" "${{ github.workspace }}/"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "Package created: $ZIP_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Droidspace Kernel
          path: "*.zip"
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version || '1.0.0' }}
          name: "Droidspace Kernel v${{ inputs.version || '1.0.0' }}"
          body: |
            ## Droidspace Kernel v${{ inputs.version || '1.0.0' }}

            **Device:** POCO F3 (alioth)
            **Base:** MagicTime Kernel (TIMISONG-dev)
            **Kernel Source:** magictime-new branch

            ### Features
            - MagicTime optimizations (PELT, uclamp, thermal pressure, CASS scheduler)
            - KernelSu support
            - Full DroidSpaces support:
              - PID/UTS/IPC/NET/User namespaces
              - Control groups (device, pids, memory, scheduler, freezer, net_prio)
              - OverlayFS, VETH, Bridge, Netfilter/NAT
              - Seccomp filtering
              - TMPFS xattr/posix acl (NixOS support)
              - ZRAM with LZ4 compression
              - RCU boost/lazy
              - TEO CPU idle governor
              - Westwood TCP congestion
              - ntsync (NT synchronization primitives for Wine/Proton)

            ${{ inputs.description || 'Droidspace Kernel for Poco F3 (alioth) with DroidSpaces support' }}
          files: "*.zip"
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}